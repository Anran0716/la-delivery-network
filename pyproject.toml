[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "la-delivery-network"
version = "0.1.0"
description = "LA County last-mile delivery station location and capacity planning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "geopandas>=1.0,<2",
    "pandas>=2.2,<4",
    "osmnx>=2,<3",
    "h3>=4,<5",
    "pulp==3.3.0",
    "highspy==1.16.0",
    "duckdb>=1,<2",
    "pyarrow>=18,<24",
    "PyYAML>=6,<7",
    "requests>=2.32,<3",
    "networkx>=3.2,<4",
    "scikit-learn>=1.5,<2",
    "scipy>=1.12,<2",
]

[project.optional-dependencies]
downloads = ["osmium>=4,<5"]
dev = ["pytest>=8,<10", "ruff==0.17.5", "pre-commit>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
