# Planning assumptions from the P2 guide; these are not measured operating data.
study:
  name: Los Angeles County mainland
  state_fips: "06"
  county_fips: "037"
  mainland_method: largest_contiguous_polygon
  projected_crs: "EPSG:3310"
  geographic_crs: "EPSG:4326"

data:
  acs_year: 2023
  acs_dataset: acs/acs5
  household_variable: B11001_001E
  household_moe_variable: B11001_001M
  census_api_base: https://api.census.gov/data
  acs_summary_url: https://www2.census.gov/programs-surveys/acs/summary_file/2023/table-based-SF/data/5YRData/acsdt5y2023-b11001.dat
  tiger_bg_url: https://www2.census.gov/geo/tiger/TIGER2023/BG/tl_2023_06_bg.zip
  tiger_faces_url: https://www2.census.gov/geo/tiger/TIGER2023/FACES/tl_2023_06037_faces.zip
  raw_dir: data/raw
  processed_dir: data/processed

demand:
  h3_resolution: 7
  allocation_method: area_weighted
  allocation_geometry: tiger_minus_perennial_water_faces
  geometry_overlap_tolerance_m2: 1.0
  parcels_per_household_per_day: 0.15
  conservation_relative_tolerance: 0.005

candidates:
  landuse: industrial
  min_area_hectares: 4
  min_spacing_m: 3000
  max_candidates: 120

travel:
  network_type: drive
  congestion_multiplier: 1.3
  coverage_minutes: 30
  matrix_cutoff_minutes: 45
  snap_warning_m: 1000

facility:
  capacity_parcels_per_day: 20000
  utilization_limit: 0.85
  fixed_cost_usd_per_day: 25000

cost:
  delivery_usd_per_parcel_minute: 0.015
  unmet_penalty_usd_per_parcel: 100

solver:
  name: PULP_CBC_CMD
  time_limit_seconds: 600
  relative_gap: 0.005

scenarios:
  peak_demand_multiplier: 1.4
  stress_utilization_limit: 1.0
  outage_coverage_minutes: 45
  capacity_values: [15000, 20000, 25000]
  fixed_cost_values: [15000, 25000, 40000]

metrics:
  coverage_threshold_minutes: 20

assumptions:
  demand_proxy: ACS 2023 five-year block-group households; not observed orders.
  parcel_rate: Planning assumption; verify parcel-volume and market-share sources before results.
  capacity: Assumed 20000 parcels per station per day with 15 percent baseline headroom.
  fixed_cost: Assumed daily rent and fixed labor; test sensitivity rather than claim actual rent.
  delivery_cost: Assumed 1.5 USD per vehicle minute times two for return, divided by 200 parcels.
  congestion: Uniform assumed multiplier; no time-of-day calibration.
  coverage: Assumed station-to-cell drive-time limit after congestion adjustment.
